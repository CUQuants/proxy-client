[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuq-proxy-client"
version = "0.3.0"
description = "SDK for the CU Quants Exchange Access Proxy — signing, idempotency, and typed errors, so a caller never hand-builds a request. REST and WebSocket (Kraken + OKX), both scoped to operator (human) and system (bot) credentials."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
websocket = [
    "websockets>=13",
]
dev = [
    "pytest>=8.3",
    "build>=1.0",
    "websockets>=13",
]

[tool.setuptools]
packages = ["proxy_client", "proxy_client.websocket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
