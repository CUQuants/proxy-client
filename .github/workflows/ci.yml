name: CI

# Direct pushes to main, and every PR targeting main (so a broken PR shows
# red before it's mergeable, not after). Together these cover both "pushed
# to main" and "merged into main" — a merge lands as both a closed,
# green-checked PR and a push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: python -m pytest -q
